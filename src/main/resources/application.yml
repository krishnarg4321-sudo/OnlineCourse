spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onlinecourse}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-base64-secret-change-me-to-a-long-base64-secret}
    expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://example.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
